name: Fork Release

# Fork-only release path for herb/terraform-provider-omada.
#
# The upstream Release workflow (.github/workflows/release.yml) builds a
# GPG-signed, Registry-shaped release and runs on any `v*` tag. On this fork the
# signing secrets (GPG_PRIVATE_KEY / PASSPHRASE) do not exist, and a signed
# Registry publication is not wanted. This workflow therefore handles ONLY the
# fork's own tags (`v*-herb.*`), builds unsigned linux/amd64 + linux/arm64
# binaries, and publishes them with a checksum manifest using the workflow's
# built-in GITHUB_TOKEN. The upstream workflow is guarded to skip `*-herb.*`.
#
# No personal access token and no new secret is required: publishing uses
# `secrets.GITHUB_TOKEN` (i.e. the Actions-provided `github.token`).
on:
  push:
    tags:
      - "v*-herb.*"

# Least privilege by default; only the publishing job opts into write.
permissions: {}

jobs:
  release:
    name: Build and publish fork release
    # Publish ONLY from the intended fork. This workflow is tagged for
    # `v*-herb.*`, a pattern any other fork or the upstream repo could also
    # push; without this guard a copied workflow would publish a release there.
    if: github.repository == 'herb/terraform-provider-omada'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets

    steps:
      # Third-party actions are pinned by commit SHA (not a moving tag) so a
      # compromised tag cannot change what runs. persist-credentials: false
      # keeps the checkout token out of the working tree's git config; the
      # publish step uses an explicit GH_TOKEN instead.
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          # The module cache is not needed: `go mod download` below fetches
          # exactly the pinned go.sum set, and the build is reproducible.
          cache: false

      # Verify the source actually builds and its tests pass BEFORE any release
      # is published, so a broken tag cannot produce a release.
      - name: Download pinned dependencies
        run: go mod download

      - name: Build (all packages)
        run: go build ./...

      - name: Unit tests
        run: go test ./... -count=1

      # Reproducible cross-builds for the two required platforms. The version
      # linker flag matches the provider entrypoint (`var version` in main.go),
      # set from the pushed tag without its leading "v".
      - name: Build linux/amd64 and linux/arm64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/terraform-provider-omada_v${ver}_linux_${arch}" \
                .
          done

      # Checksum manifest uses the conventional provider naming so a downstream
      # Pulumi Terraform-provider adapter can pin `..._SHA256SUMS` and verify
      # the exact archive it downloads. Unsigned: there is no signature file and
      # none is fabricated.
      - name: Generate SHA256SUMS
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          ( cd dist && sha256sum \
              "terraform-provider-omada_v${ver}_linux_amd64" \
              "terraform-provider-omada_v${ver}_linux_arm64" \
              > "terraform-provider-omada_v${ver}_SHA256SUMS" )
          cat "dist/terraform-provider-omada_v${ver}_SHA256SUMS"

      # Assemble as a draft, upload, then publish — so an immutable-release repo
      # seals it with the assets already in place. GH_TOKEN is the built-in
      # token; it is never echoed.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"

          # This step performs NO destructive operation on an existing release:
          # it never deletes or recreates one. If any release already exists for
          # this tag — draft or published, empty or with assets — it refuses to
          # proceed. That avoids both clobbering a shipped release and the
          # duplicate-draft/release ambiguity seen upstream. Recovery from a
          # failed run is therefore a MANUAL step: inspect the existing release,
          # delete it via the GitHub UI/API if it is an unwanted empty draft,
          # then re-run the workflow. Re-running this workflow alone will not
          # replace it.
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            assets=$(gh release view "$TAG" --json assets --jq '.assets|length')
            echo "::error::a release for $TAG already exists (assets=$assets); refusing to delete or replace it. Remove it manually, then re-run."
            exit 1
          fi

          gh release create "$TAG" --draft --verify-tag \
            --title "$TAG" --generate-notes

          gh release upload "$TAG" \
            "dist/terraform-provider-omada_v${ver}_linux_amd64" \
            "dist/terraform-provider-omada_v${ver}_linux_arm64" \
            "dist/terraform-provider-omada_v${ver}_SHA256SUMS"

          gh release edit "$TAG" --draft=false

          count=$(gh release view "$TAG" --json assets --jq '.assets|length')
          echo "attached assets: $count"
          test "$count" -ge 3
