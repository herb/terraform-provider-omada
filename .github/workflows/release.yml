name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  goreleaser:
    # Fork tags (v*-herb.*) are handled by .github/workflows/release-fork.yml.
    # Skipping them here avoids running the GPG-signed Registry release on a
    # fork that has no signing secrets and does not want a Registry release.
    if: ${{ !contains(github.ref_name, '-herb.') && github.repository == 'wncservices/terraform-provider-omada' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      # Build, archive, checksum and GPG-sign only — publishing is handled
      # below. GoReleaser's own `release.draft` setting was NOT honoured
      # against a repo with immutable releases enabled: it created the release
      # already published (and therefore sealed), so every asset upload came
      # back 422. Taking publishing away from it removes that ambiguity.
      - name: Build and sign artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub "immutable releases" seals a release when it is *published*, and
      # a sealed release rejects asset uploads. So assemble the release as a
      # draft, attach every artifact while it still accepts them, and publish
      # last — sealing it with the assets already in place. This works whether
      # or not immutable releases is enabled, so it no longer depends on a repo
      # setting that silently broke v0.4.0 through v0.5.1.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # The Registry requires the manifest alongside the archives, named
          # to match the entry GoReleaser already put in SHA256SUMS.
          cp terraform-registry-manifest.json \
             "dist/terraform-provider-omada_${VERSION}_manifest.json"

          # A release for this tag may already exist. Cutting a release from
          # the GitHub UI creates the tag *and* an empty published release, and
          # the tag push then starts this workflow. Draft releases are not
          # bound to a tag, so `gh release create --draft` does not collide
          # with it — it just adds a SECOND release object, leaving one draft
          # and one published release with the same name (seen on v0.6.1).
          #
          # `gh release view` cannot disambiguate those, so enumerate through
          # the API instead and clear every release carrying this tag. Only
          # ever delete one with no assets: re-running this workflow must never
          # be able to destroy a release that already shipped.
          gh api --paginate repos/${GITHUB_REPOSITORY}/releases \
            --jq ".[] | select(.tag_name == \"$TAG\" or .name == \"$TAG\") | \
                  \"\(.id) \(.assets | length) \(.draft)\"" \
            > /tmp/existing-releases || true

          while read -r rel_id asset_count is_draft; do
            [ -z "${rel_id:-}" ] && continue
            if [ "$asset_count" -gt 0 ]; then
              echo "::error::release $rel_id for $TAG already has $asset_count assets; refusing to replace it"
              exit 1
            fi
            echo "removing empty pre-existing release $rel_id (draft=$is_draft)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$rel_id"
          done < /tmp/existing-releases

          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes

          gh release upload "$TAG" \
            dist/*.zip \
            "dist/terraform-provider-omada_${VERSION}_SHA256SUMS" \
            "dist/terraform-provider-omada_${VERSION}_SHA256SUMS.sig" \
            "dist/terraform-provider-omada_${VERSION}_manifest.json"

          gh release edit "$TAG" --draft=false --latest

          # Fail loudly rather than leave another empty release behind: an
          # empty-but-published release is what made this bug invisible for
          # three versions.
          count=$(gh release view "$TAG" --json assets --jq '.assets|length')
          echo "attached assets: $count"
          test "$count" -ge 16
